<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta http-equiv="refresh" content="20;url=https://auxiliares-upana.web.app/">
  <title>Nos mudamos | Auxiliares</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #edf2ff;
      background:
        radial-gradient(ellipse at 12% 12%, #293b70 0, transparent 42%),
        radial-gradient(ellipse at 90% 90%, #56345f 0, transparent 38%),
        #0b1020;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .card {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: minmax(180px, 240px) 1fr;
      gap: 30px;
      align-items: center;
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 26px;
      background: rgba(18, 25, 44, .9);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .45);
    }

    .gif {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 20px;
      background: #e8dfd5;
    }

    .eyebrow {
      color: #b6c3ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 5vw, 43px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    p {
      color: #bbc5d8;
      font-size: 15px;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      padding: 0 20px;
      border-radius: 14px;
      color: #11162a;
      background: linear-gradient(135deg, #b9c6ff, #e2baff);
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .count {
      margin-top: 14px;
      color: #929eb7;
      font-size: 12px;
    }

    .track {
      height: 5px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .1);
    }

    .progress {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #9eafff, #e3aaff);
      transform-origin: left;
      animation: countdown 20s linear forwards;
    }

    @keyframes countdown {
      to {
        transform: scaleX(0);
      }
    }

    @media (max-width: 600px) {
      .card {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .gif {
        width: min(210px, 70vw);
        margin: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="gif"
      src="https://i.giphy.com/FaFu1s2hO1xYHdpk6N.webp"
      alt="Ventanas de error por todas partes"
    >

    <section>
      <div class="eyebrow">Aviso de mudanza digital</div>

      <h1>Nos mudamos.<br>Este enlace ya está jubilado.</h1>

      <p>
        La página ahora tiene una nueva dirección.
        Puedes esperar un momento o ir directamente con el botón.
      </p>

      <a class="button" href="https://auxiliares-upana.web.app/">
        Ir a la nueva página <span aria-hidden="true">→</span>
      </a>

      <div class="count">
        Redirigiendo en <span id="seconds">20</span> segundos…
      </div>

      <div class="track" aria-hidden="true">
        <div class="progress"></div>
      </div>
    </section>
  </main>

  <script>
    const newPage = "https://auxiliares-upana.web.app/";
    let secondsLeft = 20;
    const secondsLabel = document.getElementById("seconds");

    const countdown = setInterval(() => {
      secondsLeft -= 1;
      secondsLabel.textContent = secondsLeft;

      if (secondsLeft <= 0) {
        clearInterval(countdown);
      }
    }, 1000);

    setTimeout(() => {
      window.location.replace(newPage);
    }, 20000);
  </script>
</body>
</html>
